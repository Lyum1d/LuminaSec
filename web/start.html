<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRC Agent · 选择工作模式</title>
<!--
  起始选择界面（v102 新增）。

  为什么单独做一页，而不是在 web 界面里弹窗：
    · 后续会继续加新入口（例如「CTF 专项」），弹窗式的二选一很快就不够用；
    · 独立页可以在**进入工作区之前**就把模式定下来，避免"先进去、再回头改"；
    · 与主 UI / 控制台解耦 —— 三者互不影响（沿用主 UI「一个字节都不动」的同款约定）。

  本页自包含（样式内联），只用 /static 下的主题变量约定，不依赖 style.css。
-->
<style>
  :root{
    --bg:#0f1318; --panel:#161c23; --panel2:#1b232c; --line:#26313c;
    --fg:#e6edf3; --fg-dim:#93a1b1; --accent:#4c8dff; --accent2:#7c5cff;
    --ok:#39b57a; --warn:#e0a23c;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#f7f9fc; --line:#dde3ea;
    --fg:#1c2430; --fg-dim:#5b6a7d; --accent:#1f6feb; --accent2:#6b4ff0;
    --ok:#1f9254; --warn:#9a6b00;
    --shadow:0 10px 30px rgba(20,30,50,.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .head{text-align:center; margin-bottom:28px}
  .head h1{margin:0 0 8px; font-size:26px; letter-spacing:.5px}
  .head p{margin:0; color:var(--fg-dim); font-size:14px}
  .head .sub{margin-top:10px; font-size:12.5px; color:var(--fg-dim)}

  .grid{
    display:grid; gap:18px; width:100%; max-width:920px;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  }
  .card{
    position:relative; text-align:left; cursor:pointer;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px 20px 20px; color:inherit; font:inherit;
    transition:transform .14s ease, border-color .14s ease, box-shadow .14s ease;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:var(--shadow)}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .card .ico{font-size:30px; line-height:1}
  .card h2{margin:12px 0 6px; font-size:18px}
  .card .desc{margin:0 0 12px; color:var(--fg-dim); font-size:13.5px}
  .card ul{margin:0; padding-left:18px; color:var(--fg-dim); font-size:12.5px}
  .card ul li{margin:3px 0}
  .card .tagline{
    display:inline-block; margin-top:12px; padding:2px 9px; border-radius:999px;
    font-size:11.5px; border:1px solid var(--line); color:var(--fg-dim);
    background:var(--panel2);
  }
  .card.wb{border-left:3px solid var(--accent2)}
  .card.bb{border-left:3px solid var(--accent)}

  .last{
    display:none; margin-top:6px; font-size:11.5px; color:var(--ok);
    border:1px solid var(--ok); border-radius:999px; padding:1px 8px;
  }
  .card.is-last .last{display:inline-block}

  .foot{
    margin-top:26px; display:flex; gap:14px; align-items:center;
    color:var(--fg-dim); font-size:12.5px; flex-wrap:wrap; justify-content:center;
  }
  .foot a{color:var(--accent); text-decoration:none}
  .foot a:hover{text-decoration:underline}
  .foot button{
    background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; font-size:12.5px;
  }
  .foot button:hover{border-color:var(--accent)}

  /* 预留：新模式卡片的"即将支持"态 */
  .card.disabled{cursor:not-allowed; opacity:.55}
  .card.disabled:hover{transform:none; border-color:var(--line); box-shadow:none}
  .card.disabled .tagline{border-color:var(--warn); color:var(--warn)}
</style>
</head>
<body>
  <div class="head">
    <h1>SRC 渗透 Agent</h1>
    <p>请选择本次要进入的工作模式</p>
    <div class="sub">模式决定<b>界面布局</b>与<b>可用的工具集</b>；进入后随时可在顶部切换。</div>
  </div>

  <div class="grid" id="modes"><!-- 由下方脚本渲染 --></div>

  <div class="foot">
    <button id="lastBtn" style="display:none">↵ 用上次的模式直接进入</button>
    <a href="/console" target="_blank" rel="noopener">配置控制台 →</a>
    <button id="themeBtn">🌙 切换主题</button>
  </div>

<script>
/* ============================================================================
   模式注册表 —— 新增模式只改这一个数组
   ============================================================================
   字段说明：
     id      必填，唯一标识；会作为 /app?mode=<id> 传下去，也是 localStorage 的键值
     name    卡片标题
     icon    卡片图标（emoji 即可）
     desc    一句话说明
     bullets 3~4 条要点（界面/工具集差异写清楚）
     cls     可选，卡片着色类（bb=黑盒蓝 / wb=白盒紫）
     ready   false 时渲染为「即将支持」，不可点击（用于预留位）
     status  未 ready 时显示的文字
   ============================================================================ */
const MODES = [
  {
    id: 'blackbox',
    name: '黑盒侧测试',
    icon: '🌐',
    cls: 'bb',
    desc: '面向已授权的目标域名/IP，做外部侦察与漏洞验证。',
    bullets: [
      '工具集：你配置的外部工具箱 + 本机自备工具目录 + 内置能力（不含 code_*）',
      '项目按「授权域名」组织，受授权白名单约束',
      '沿用现有界面：项目 / 工具箱 / 报告 / 因果图',
    ],
  },
  {
    id: 'whitebox',
    name: '白盒侧测试',
    icon: '📦',
    cls: 'wb',
    desc: '面向本机源码目录，做代码审计（入库 → 索引 → 查 sink → 逆向）。',
    bullets: [
      '工具集：只放 code_*（ingest / index / search / read / list）',
      '项目按「代码库」组织，入库即记录一条授权',
      '新增白盒面板：已入库代码库 / 建索引状态 / 候选检索',
    ],
  },
  // ↓↓↓ 预留位：以后加新模式照抄一段即可（例如 CTF 专项）
  {
    id: 'ctf',
    name: 'CTF 专项',
    icon: '🚩',
    cls: '',
    desc: '面向 CTF 赛题（Web / Misc / Reverse）的解题模式。',
    bullets: ['解题向工具与提示词', '按题目而非授权域名组织'],
    ready: false,
    status: '即将支持',
  },
];

const LS_MODE = 'src_mode';       // 记住上次选择（与 web/app.js 约定一致）
const LS_THEME = 'src_theme';     // 与主 UI 同一套主题键

/* ---------- 主题 ---------- */
(function initTheme(){
  let t = 'dark';
  try { t = localStorage.getItem(LS_THEME) || 'dark'; } catch(e){}
  document.documentElement.setAttribute('data-theme', t);
})();
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nxt);
  try { localStorage.setItem(LS_THEME, nxt); } catch(e){}
});

/* ---------- 记住/进入 ---------- */
let lastMode = '';
try { lastMode = localStorage.getItem(LS_MODE) || ''; } catch(e){}

function enter(id){
  try { localStorage.setItem(LS_MODE, id); } catch(e){}
  location.href = '/app?mode=' + encodeURIComponent(id);
}

/* ---------- 渲染卡片 ---------- */
const host = document.getElementById('modes');
MODES.forEach(m => {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card ' + (m.cls || '') + (m.ready === false ? ' disabled' : '')
                   + (m.id === lastMode ? ' is-last' : '');
  card.innerHTML = `
    <div class="ico">${m.icon}</div>
    <h2>${m.name}</h2>
    <span class="last">上次使用</span>
    <p class="desc">${m.desc}</p>
    <ul>${(m.bullets || []).map(b => `<li>${b}</li>`).join('')}</ul>
    ${m.ready === false ? `<span class="tagline">${m.status || '即将支持'}</span>` : ''}
  `;
  if (m.ready === false){
    card.addEventListener('click', () => {});
    card.title = m.status || '即将支持';
  } else {
    card.addEventListener('click', () => enter(m.id));
  }
  host.appendChild(card);
});

/* ---------- "用上次的模式直接进入" ---------- */
const lastBtn = document.getElementById('lastBtn');
if (lastMode && MODES.some(m => m.id === lastMode && m.ready !== false)){
  lastBtn.style.display = '';
  lastBtn.addEventListener('click', () => enter(lastMode));
}

/* ---------- 快捷键：1 / 2 直接进入前两个可用模式 ---------- */
document.addEventListener('keydown', e => {
  const usable = MODES.filter(m => m.ready !== false);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= usable.length) enter(usable[n-1].id);
});
</script>
</body>
</html>
